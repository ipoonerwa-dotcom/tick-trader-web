<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tick Trader</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="line" x1="118" y1="0" x2="398" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="1" stop-color="#FFC21A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="119" fill="none" stroke="#FFD23F" stroke-opacity=".28" stroke-width="2"/>
  <!-- A tick mark whose long stroke is a rising price line; the dot is the latest trade. -->
  <path d="M118 262 L198 342 L262 278 L290 300 L398 170" fill="none" stroke="url(#line)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="398" cy="170" r="27" fill="#FFD23F" filter="url(#glow)"/>
  <circle cx="398" cy="170" r="10" fill="#FFFBEA"/>
</svg>
